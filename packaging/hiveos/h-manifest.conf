# shellcheck shell=bash
# shellcheck disable=SC2034
# HiveOS custom miner manifest for seine. build.sh fills in the version.

CUSTOM_NAME=seine-hiveos
CUSTOM_VERSION=@SEINE_VERSION@

# Package directory. The SEINE_HIVEOS_* overrides exist for the
# package tests; HiveOS leaves them unset.
SEINE_HOME=${SEINE_HIVEOS_HOME:-/hive/miners/custom/$CUSTOM_NAME}

# Generated by h-config.sh: one seine argument per line.
CUSTOM_CONFIG_FILENAME=$SEINE_HOME/seine.args
CUSTOM_LOG_BASENAME=${SEINE_HIVEOS_LOG_DIR:-/var/log/miner/custom}/$CUSTOM_NAME

# Persistent seine state (tuning caches, saved settings). Kept outside the
# package directory, which HiveOS replaces on every upgrade.
SEINE_DATA_DIR=${SEINE_HIVEOS_DATA_DIR:-/var/lib/seine}

# Local control API that h-stats.sh reads. Loopback only.
SEINE_API_PORT=${SEINE_HIVEOS_API_PORT:-9977}
SEINE_API_COOKIE=$SEINE_HOME/control-api.cookie

SEINE_DEFAULT_POOL=stratum+tcp://bntpool.com:3333
