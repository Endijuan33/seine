# shellcheck shell=bash
# shellcheck disable=SC2034
# mmpOS custom miner settings for seine. build.sh fills in the version.

EXTERNAL_NAME=seine
EXTERNAL_VERSION=@SEINE_VERSION@

# Package directory. mmpOS extracts each custom miner to
# /opt/mmp/miners/custom-<hash of the download URL>. The SEINE_MMPOS_*
# overrides exist for the package tests; mmpOS leaves them unset.
SEINE_HOME=${SEINE_MMPOS_HOME:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}

# Generated by mmp-launch.sh: one seine argument per line.
SEINE_ARGS_FILE=$SEINE_HOME/seine.args

# Persistent seine state (tuning caches, saved settings). Kept beside the
# package directory, because a new package version unpacks to a new one.
SEINE_DATA_DIR=${SEINE_MMPOS_DATA_DIR:-${SEINE_HOME%/*}/seine-data}

# Local control API that mmp-stats.sh reads. Loopback only.
SEINE_API_PORT=9977
SEINE_API_COOKIE=$SEINE_HOME/control-api.cookie

# mmpOS's description of the rig's GPUs.
SEINE_GPU_INFO=${SEINE_MMPOS_ROOT:-}/run/gpu-info.json

SEINE_DEFAULT_POOL=stratum+tcp://bntpool.com:3333
