name: site

on:
  push:
    branches: [master]
    paths: ["site/**", "PRIVACY.md", "docs/assets/brand/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # prebuild syncs brand assets from docs/assets/brand and runs the content checks
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name seineminer --branch main --commit-dirty=true
      - name: Notify IndexNow (Bing, Yandex, Seznam, Naver)
        run: npm run indexnow
        continue-on-error: true
