name: Content facts
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Release]
    types: [completed]
  push:
    branches: [master]
    paths: ["site/editorial/release-facts.json", "site/scripts/check-release-facts*", ".github/workflows/content-facts.yml"]
permissions:
  contents: read
jobs:
  release-facts:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/checkout@v4
        with:
          repository: zpalmtree/blocknet-pool
          ref: master
          path: pool
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test site/scripts/check-release-facts.test.mjs
      - run: node site/scripts/check-release-facts.mjs --live
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node site/scripts/check-release-facts.mjs --live --manifest pool/frontend/blog/miner-release.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
