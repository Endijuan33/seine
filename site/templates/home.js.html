<script>
(function () {
  var REPO = "zpalmtree/seine";
  var LABELS = {
    "windows": "Download for Windows",
    "mac-arm": "Download for macOS",
    "mac-intel": "Download for macOS (Intel)",
    "linux": "Download for Linux",
    "linux-arm": "Download for Linux ARM64"
  };
  function detect() {
    var ua = navigator.userAgent || "";
    var plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
    if (/Win/i.test(plat) || /Windows/i.test(ua)) return "windows";
    if (/Mac/i.test(plat) || /Mac OS X/i.test(ua)) return /iPhone|iPad/.test(ua) ? null : "mac-arm";
    if (/Android|iPhone|iPad/i.test(ua)) return null;
    if (/Linux/i.test(plat) || /Linux/i.test(ua)) return /aarch64|arm64/i.test(plat + ua) ? "linux-arm" : "linux";
    return null;
  }
  var os = detect();
  var primary = document.getElementById("primary-dl");
  if (os) {
    var card = document.querySelector('.pl[data-os="' + os + '"]');
    if (card) {
      card.classList.add("match");
      primary.href = card.href;
      document.getElementById("primary-label").textContent = LABELS[os];
    }
  } else {
    document.getElementById("primary-label").textContent = "Choose your platform";
  }
  // Fill in version and file sizes from the GitHub API; the links work without it.
  fetch("https://api.github.com/repos/" + REPO + "/releases/latest", { headers: { Accept: "application/vnd.github+json" } })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (rel) {
      var sizes = {};
      (rel.assets || []).forEach(function (a) { sizes[a.name] = a.size; });
      document.querySelectorAll(".pl").forEach(function (el) {
        var name = el.href.split("/").pop();
        if (sizes[name]) {
          var mb = (sizes[name] / 1048576).toFixed(1) + " MB";
          el.querySelector(".arrow").textContent = mb + " ↓";
        }
      });
      var meta = rel.tag_name;
      if (os) {
        var c = document.querySelector('.pl[data-os="' + os + '"]');
        var n = c && c.href.split("/").pop();
        if (n && sizes[n]) meta += " · " + (sizes[n] / 1048576).toFixed(1) + " MB";
      }
      document.getElementById("primary-meta").textContent = meta;
      document.getElementById("release-line").innerHTML = 'All files are from <a href="' + rel.html_url + '">' + rel.tag_name + '</a>, released ' +
        new Date(rel.published_at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) + '.';
    })
    .catch(function () {});
  document.querySelectorAll(".copy").forEach(function (b) {
    b.addEventListener("click", function () {
      var t = b.getAttribute("data-copy");
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () {
        b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1400);
      }).catch(function () {});
    });
  });
})();
</script>
