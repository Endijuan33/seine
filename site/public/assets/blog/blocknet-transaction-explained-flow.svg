<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Illustrative Blocknet transaction accounting</title><desc id="desc">1: a selected 10 BNT input. 2: a 3 BNT recipient output. 3: a 6.9995 BNT change output returning to the sender. 4: an assumed 0.0005 BNT fee, separate from the two outputs. These are illustrative wallet values, not public explorer labels.</desc><rect x="0" y="0" width="1200" height="675" rx="28" fill="#f3f1e7" stroke="none" stroke-width="2"/><rect x="55" y="205" width="330" height="250" rx="22" fill="#fffef9" stroke="#c7cdbb" stroke-width="2"/><circle cx="97" cy="247" r="27" fill="#174b35"/><text x="97" y="257" text-anchor="middle" font-size="29" font-family="Arial,sans-serif" fill="white">1</text><rect x="175" y="245" width="88" height="65" rx="12" fill="#c9ed9c" stroke="#174b35" stroke-width="2"/><rect x="227" y="267" width="45" height="25" rx="7" fill="#fffef9" stroke="#174b35" stroke-width="2"/><circle cx="242" cy="279" r="4" fill="#174b35"/><text x="220" y="379" fill="#174b35" font-family="Arial,sans-serif" font-size="44" font-weight="600" text-anchor="middle">10 BNT</text><path d="M385 330H500V138H715M500 330H715M500 330V522H715" fill="none" stroke="#456f50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M698 125l17 13-17 13" fill="none" stroke="#456f50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M698 317l17 13-17 13" fill="none" stroke="#456f50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M698 509l17 13-17 13" fill="none" stroke="#456f50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="745" y="55" width="400" height="166" rx="22" fill="#c9ed9c" stroke="#174b35" stroke-width="2"/><circle cx="787" cy="97" r="27" fill="#174b35"/><text x="787" y="107" text-anchor="middle" font-size="29" font-family="Arial,sans-serif" fill="white">2</text><circle cx="865" cy="95" r="19" fill="none" stroke="#174b35" stroke-width="4"/><path d="M832 143c0-35 66-35 66 0" fill="none" stroke="#174b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="979" y="151" fill="#174b35" font-family="Arial,sans-serif" font-size="42" font-weight="600" text-anchor="middle">3 BNT</text><rect x="745" y="247" width="400" height="166" rx="22" fill="#fffef9" stroke="#c7cdbb" stroke-width="2"/><circle cx="787" cy="289" r="27" fill="#174b35"/><text x="787" y="299" text-anchor="middle" font-size="29" font-family="Arial,sans-serif" fill="white">3</text><rect x="835" y="285" width="88" height="65" rx="12" fill="#c9ed9c" stroke="#174b35" stroke-width="2"/><rect x="887" y="307" width="45" height="25" rx="7" fill="#fffef9" stroke="#174b35" stroke-width="2"/><circle cx="902" cy="319" r="4" fill="#174b35"/><text x="945" y="387" fill="#174b35" font-family="Arial,sans-serif" font-size="39" font-weight="600" text-anchor="middle">6.9995 BNT</text><rect x="745" y="467" width="400" height="110" rx="22" fill="#f3f1e7" stroke="#c7cdbb" stroke-width="2"/><circle cx="787" cy="509" r="27" fill="#174b35"/><text x="787" y="519" text-anchor="middle" font-size="29" font-family="Arial,sans-serif" fill="white">4</text><text x="975" y="535" fill="#174b35" font-family="Arial,sans-serif" font-size="36" font-weight="600" text-anchor="middle">0.0005 BNT</text><text x="220" y="585" fill="#174b35" font-family="Arial,sans-serif" font-size="25" font-weight="600" text-anchor="start">10 = 3 + 6.9995 + 0.0005</text></svg>
