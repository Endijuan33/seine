ke-linecap="round" stroke-linejoin="round"/><path d="M868 246h105" fill="none" stroke="#c7cdbb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M868 277h70" fill="none" stroke="#c7cdbb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="920" cy="415" r="81" fill="#c9ed9c" stroke="#174b35" stroke-width="3"/><text x="920" y="432" fill="#174b35" font-family="Arial,sans-serif" font-size="38" font-weight="600" text-anchor="middle">5 BNT</text><text x="600" y="370" fill="#174b35" font-family="Arial,sans-serif" font-size="90" font-weight="600" text-anchor="middle">=</text></svg>
