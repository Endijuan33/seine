[package]
name = "seine-telemetry"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[features]
server = ["dep:axum", "dep:tokio", "dep:tokio-postgres"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }

[[bin]]
name = "seine-telemetry"
path = "src/main.rs"
required-features = ["server"]
