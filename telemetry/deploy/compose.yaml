services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:?Set TELEMETRY_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 10s
      timeout: 5s
      retries: 10
  collector:
    build:
      context: ../..
      dockerfile: telemetry/deploy/Dockerfile
    restart: unless-stopped
    environment:
      TELEMETRY_BIND: 0.0.0.0:9080
      TELEMETRY_DATABASE_URL: "host=db user=telemetry dbname=telemetry password=${TELEMETRY_DB_PASSWORD:?Set TELEMETRY_DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TELEMETRY_HOST: ${TELEMETRY_HOST:?Set TELEMETRY_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - collector
volumes:
  database:
  certificates:
  caddy_config:
